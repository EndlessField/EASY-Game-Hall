<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇</title>
    <link rel="stylesheet" href="lib/fontawesome-free-7.3.1-web/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --danger-color: #e74c3c;
            --dark-bg: #1a1a2e;
            --medium-bg: #16213e;
            --light-bg: #0f3460;
            --text-color: #ffffff;
            --text-secondary: #a0d2ff;
            --grid-color: #1e3a5f;
            --gold: #f1c40f;
            --silver: #bdc3c7;
            --bronze: #8d6e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg), var(--medium-bg), var(--light-bg));
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 800px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(0, 195, 255, 0.6);
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            font-weight: 900;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.5;
            opacity: 0.85;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
        }

        .game-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        #score {
            font-size: 2.4rem;
            margin: 10px 0;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            padding: 12px 28px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 15px;
            border: 2px solid rgba(52, 152, 219, 0.5);
            transition: all 0.25s;
            min-width: 220px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
            letter-spacing: 1px;
        }

        #score.score-pop {
            animation: scorePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-color: var(--secondary-color);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.5);
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            40% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        canvas {
            border: 4px solid #2c3e50;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(52, 152, 219, 0.15);
            background: rgba(0, 0, 0, 0.2);
            display: block;
            image-rendering: auto;
        }

        #gameCanvas {
            width: 500px;
            height: 500px;
            max-width: 90vw;
            max-height: 90vw;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 240px;
            max-width: 340px;
            flex: 1;
        }

        .panel {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(52, 152, 219, 0.25);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .panel h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            color: var(--primary-color);
            font-size: 1.35rem;
            letter-spacing: 0.5px;
        }

        .panel h3 i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 18px 0 8px;
            justify-items: center;
        }

        .control-btn {
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, var(--primary-color), #2980b9);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
            outline: none;
        }

        .control-btn:active {
            transform: scale(0.9);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            background: linear-gradient(145deg, #2980b9, #2573a7);
            transition: all 0.05s;
        }

        .control-btn:active::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: rgba(52, 152, 219, 0.25);
            animation: btnRipple 0.35s ease-out;
        }

        @keyframes btnRipple {
            from { inset: -4px; opacity: 1; }
            to { inset: -20px; opacity: 0; }
        }

        #up { grid-column: 2; grid-row: 1; }
        #left { grid-column: 1; grid-row: 2; }
        #down { grid-column: 2; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }

        .game-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.94);
            padding: 35px 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 1000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
            border: 2px solid var(--primary-color);
            width: 92%;
            max-width: 480px;
            animation: overlayIn 0.3s ease-out;
        }

        @keyframes overlayIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .game-overlay h2 {
            font-size: 2.3rem;
            margin-bottom: 18px;
            color: var(--danger-color);
            text-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
            letter-spacing: 1px;
        }

        .game-overlay p {
            font-size: 1.6rem;
            margin: 16px 0;
            font-weight: 500;
        }

        .game-overlay input {
            font-size: 1.15rem;
            padding: 14px 18px;
            margin: 16px 0;
            width: 100%;
            border-radius: 30px;
            border: 2px solid var(--primary-color);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            text-align: center;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            outline: none;
        }

        .game-overlay input:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 18px rgba(46, 204, 113, 0.45);
            background: rgba(255, 255, 255, 0.13);
        }

        .game-overlay input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            background: linear-gradient(145deg, var(--secondary-color), #27ae60);
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.25s;
            margin: 8px;
            min-width: 150px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
            font-weight: 600;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        }
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.08s;
        }

        .btn-danger {
            background: linear-gradient(145deg, var(--danger-color), #c0392b);
        }
        .btn-secondary {
            background: linear-gradient(145deg, var(--primary-color), #2980b9);
        }

        #rankingList {
            list-style: none;
            padding: 0;
            margin: 0;
            counter-reset: rank;
        }

        #rankingList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            margin: 7px 0;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-size: 1.05rem;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        #rankingList li:hover {
            background: rgba(52, 152, 219, 0.18);
            transform: translateX(4px);
            border-left-color: var(--primary-color);
        }

        #rankingList li.rank-1 {
            background: linear-gradient(90deg, rgba(241, 196, 15, 0.25), transparent);
            border-left-color: var(--gold);
        }
        #rankingList li.rank-2 {
            background: linear-gradient(90deg, rgba(189, 195, 199, 0.22), transparent);
            border-left-color: var(--silver);
        }
        #rankingList li.rank-3 {
            background: linear-gradient(90deg, rgba(141, 110, 80, 0.22), transparent);
            border-left-color: var(--bronze);
        }

        #rankingList li.ranking-empty {
            color: #888;
            text-align: center;
            justify-content: center;
            padding: 16px;
            background: none;
            border-left: none;
            cursor: default;
        }

        #rankingList li span:first-child {
            font-weight: bold;
            color: #ddd;
            flex: 1;
        }
        #rankingList li span:last-child {
            font-weight: bold;
            color: var(--secondary-color);
            font-size: 1.15rem;
            margin-left: 12px;
        }

        .ranking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .clear-btn {
            background: rgba(231, 76, 60, 0.18);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            outline: none;
        }
        .clear-btn:hover {
            background: rgba(231, 76, 60, 0.35);
        }

        .level-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            font-size: 1.1rem;
        }
        .level-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            flex: 1;
            overflow: hidden;
            min-width: 80px;
        }
        .level-progress {
            height: 100%;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border-radius: 4px;
            width: 0%;
            transition: width 0.4s ease;
        }
        #level {
            font-weight: bold;
            color: var(--secondary-color);
            font-size: 1.3rem;
            min-width: 24px;
            text-align: center;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 14px;
            text-align: center;
            gap: 10px;
        }
        .stat {
            background: rgba(0, 0, 0, 0.3);
            padding: 14px 10px;
            border-radius: 10px;
            flex: 1;
            min-width: 80px;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin: 4px 0;
            transition: all 0.2s;
        }
        .stat-value.pop {
            animation: statPop 0.35s ease-out;
            color: #ffcc00;
        }
        @keyframes statPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .pc-controls {
            background: rgba(0, 0, 0, 0.35);
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            margin-top: 14px;
            text-align: center;
            max-width: 500px;
            border: 1px solid rgba(52, 152, 219, 0.25);
            line-height: 1.6;
            letter-spacing: 0.3px;
        }
        .pc-controls strong {
            color: var(--primary-color);
        }
        .pc-controls .key-hint {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            margin: 0 2px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 工具类 */
        .mt-16 { margin-top: 16px; }
        .mt-20 { margin-top: 20px; }
        .mt-25 { margin-top: 25px; }
        .mt-30 { margin-top: 30px; }
        .text-center { text-align: center; }
        .flex-wrap { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

        .food-preview {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 120px;
        }
        .food-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(145deg, #FF5252, #c0392b);
            box-shadow: 0 0 25px rgba(255, 82, 82, 0.7), 0 0 50px rgba(255, 82, 82, 0.3);
            position: relative;
            animation: pulse 1.5s infinite ease-in-out;
        }
        .food-circle::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 10px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(255, 82, 82, 0.7), 0 0 50px rgba(255, 82, 82, 0.3);
            }
            50% {
                transform: scale(1.12);
                box-shadow: 0 0 35px rgba(255, 82, 82, 0.9), 0 0 65px rgba(255, 82, 82, 0.5);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            .side-panel {
                width: 100%;
                max-width: 500px;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 14px;
            }
            .panel {
                flex: 1;
                min-width: 230px;
            }
            .header h1 { font-size: 2.4rem; }
            #gameCanvas {
                width: 420px;
                height: 420px;
                max-width: 85vw;
                max-height: 85vw;
            }
        }

        @media (max-width: 600px) {
            .controls { gap: 8px; }
            .control-btn {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
            .header h1 { font-size: 2rem; letter-spacing: 1px; }
            .header p { font-size: 0.95rem; }
            #score {
                font-size: 1.8rem;
                padding: 10px 18px;
                min-width: 180px;
            }
            .btn {
                padding: 12px 20px;
                font-size: 0.95rem;
                min-width: 120px;
                margin: 5px;
            }
            #gameCanvas {
                width: 330px;
                height: 330px;
                max-width: 88vw;
                max-height: 88vw;
            }
            .game-overlay { padding: 25px 20px; }
            .game-overlay h2 { font-size: 1.8rem; }
            .game-overlay p { font-size: 1.3rem; }
            .control-btn {
                width: 54px;
                height: 54px;
                font-size: 21px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
            }
            .controls { gap: 7px; margin: 12px 0 4px; }
            .pc-controls { font-size: 0.78rem; padding: 10px 14px; border-radius: 20px; }
        }

        @media (max-width: 380px) {
            #gameCanvas {
                width: 280px;
                height: 280px;
                max-width: 92vw;
                max-height: 92vw;
            }
            .control-btn { width: 46px; height: 46px; font-size: 18px; }
            .controls { gap: 5px; }
            #score { font-size: 1.5rem; padding: 8px 14px; }
            .header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="header fade-in">
        <h1><i class="fas fa-gamepad"></i> 贪吃蛇</h1>
        <p>经典游戏 · 控制蛇吃食物，避免撞墙或自己的身体！</p>
        <p>由Printf("%s","Hello world.")利用AI技术开发。</p>
    </div>

    <div class="game-container">
        <div class="game-board">
            <div id="score">得分: 0</div>
            <canvas id="gameCanvas" width="500" height="500"></canvas>

            <div class="controls">
                <div></div>
                <button class="control-btn" id="up" type="button" aria-label="上"><i class="fas fa-arrow-up"></i></button>
                <div></div>
                <button class="control-btn" id="left" type="button" aria-label="左"><i class="fas fa-arrow-left"></i></button>
                <button class="control-btn" id="down" type="button" aria-label="下"><i class="fas fa-arrow-down"></i></button>
                <button class="control-btn" id="right" type="button" aria-label="右"><i class="fas fa-arrow-right"></i></button>
            </div>

            <div class="pc-controls">
                <strong>键盘控制：</strong>
                <span class="key-hint">↑↓←→</span> 或
                <span class="key-hint">WASD</span> 移动 |
                <span class="key-hint">P</span> 暂停 |
                <span class="key-hint">R</span> 重新开始 |
                <span class="key-hint">Enter</span> 确认
            </div>
        </div>

        <div class="side-panel">
            <div class="panel">
                <h3><i class="fas fa-apple-alt"></i> 食物预览</h3>
                <div class="food-preview">
                    <div class="food-circle"></div>
                </div>
                <div class="level-indicator">
                    <span>等级:</span>
                    <div class="level-bar">
                        <div class="level-progress" id="levelProgress"></div>
                    </div>
                    <span id="level">1</span>
                </div>
            </div>

            <div class="panel">
                <div class="ranking-header">
                    <h3><i class="fas fa-trophy"></i> 排行榜</h3>
                    <button class="clear-btn" onclick="clearRanking()" type="button" aria-label="清空排行榜">
                        <i class="fas fa-trash-alt"></i> 清空
                    </button>
                </div>
                <ol id="rankingList"></ol>
            </div>

            <div class="panel">
                <h3><i class="fas fa-chart-line"></i> 游戏统计</h3>
                <div class="game-stats">
                    <div class="stat">
                        <div class="stat-value" id="food-count">0</div>
                        <div class="stat-label">吃食物数</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="snake-length">3</div>
                        <div class="stat-label">蛇长度</div>
                    </div>
                </div>
                <div class="mt-16 text-center flex-wrap">
                    <button class="btn btn-secondary" onclick="togglePause()" id="pauseBtn" type="button">
                        <i class="fas fa-pause"></i> 暂停游戏
                    </button>
                    <button class="btn" onclick="restartGame()" type="button">
                        <i class="fas fa-redo"></i> 重新开始
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div class="game-overlay" id="gameOver">
        <h2><i class="fas fa-skull"></i> 游戏结束!</h2>
        <p>得分: <span id="finalScore">0</span></p>
        <input type="text" id="playerName" placeholder="输入你的名字" maxlength="12" autocomplete="off">
        <div class="mt-20 flex-wrap">
            <button class="btn" onclick="saveScore()" type="button">
                <i class="fas fa-save"></i> 保存记录
            </button>
            <button class="btn btn-secondary" onclick="restartGame()" type="button">
                <i class="fas fa-redo"></i> 重新开始
            </button>
        </div>
    </div>

    <!-- 暂停弹窗 -->
    <div class="game-overlay" id="pauseMenu">
        <h2><i class="fas fa-pause-circle"></i> 游戏暂停</h2>
        <p>当前得分: <span id="pauseScore">0</span></p>
        <div class="mt-25 flex-wrap">
            <button class="btn" onclick="togglePause()" type="button">
                <i class="fas fa-play"></i> 继续游戏
            </button>
            <button class="btn btn-secondary" onclick="restartGame()" type="button">
                <i class="fas fa-redo"></i> 重新开始
            </button>
        </div>
    </div>

    <script>
        (function() {
            class Particle {
                constructor(x, y, color, speed, life) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.vx = (Math.random() - 0.5) * speed * 2;
                    this.vy = (Math.random() - 0.5) * speed * 2;
                    this.life = life;
                    this.maxLife = life;
                    this.size = Math.random() * 4 + 2;
                }

                update(dt) {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    this.vx *= 0.94;
                    this.vy *= 0.94;
                    this.life -= dt;
                    return this.life > 0;
                }

                draw(ctx) {
                    const alpha = Math.max(0, this.life / this.maxLife);
                    const size = this.size * alpha;
                    ctx.fillStyle = this.color.replace('rgb', 'rgba').replace(')', `,${alpha})`);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            class ParticleSystem {
                constructor() {
                    this.particles = [];
                }

                emit(x, y, count, color, speed = 120, life = 0.5) {
                    for (let i = 0; i < count; i++) {
                        this.particles.push(new Particle(x, y, color, speed, life + Math.random() * 0.3));
                    }
                }

                update(dt) {
                    this.particles = this.particles.filter(p => p.update(dt));
                }

                draw(ctx) {
                    for (const p of this.particles) {
                        p.draw(ctx);
                    }
                }

                clear() {
                    this.particles = [];
                }
            }

            class SnakeGame {
                constructor() {
                    this.canvas = document.getElementById('gameCanvas');
                    this.ctx = this.canvas.getContext('2d');
                    this.gridSize = 20;
                    this.gridCount = this.canvas.width / this.gridSize;

                    this.particleSystem = new ParticleSystem();
                    this.animationFrameId = null;
                    this.lastFrameTime = null;
                    this.logicAccumulator = 0;
                    this.foodPulsePhase = 0;

                    this.reset();
                    this.setupControls();
                    this.loadRanking();
                    this.startRenderLoop();
                    this.start();
                }

                reset() {
                    const startX = Math.floor(this.gridCount / 2) * this.gridSize;
                    const startY = Math.floor(this.gridCount / 2) * this.gridSize;
                    this.snake = [
                        { x: startX, y: startY },
                        { x: startX - this.gridSize, y: startY },
                        { x: startX - this.gridSize * 2, y: startY },
                    ];

                    this.dx = this.gridSize;
                    this.dy = 0;
                    this.nextDx = this.gridSize;
                    this.nextDy = 0;
                    this.score = 0;
                    this.foodCount = 0;
                    this.level = 1;
                    this.gameSpeed = 150;
                    this.isGameRunning = false;
                    this.isPaused = false;
                    this.gameOverTriggered = false;
                    this.lastDirection = 'right';
                    this.directionChangedThisFrame = false;

                    this.generateFood();
                    this.particleSystem.clear();
                    this.logicAccumulator = 0;
                    this.updateUI();
                }

                startRenderLoop() {
                    if (this.animationFrameId) return;
                    this.lastFrameTime = performance.now();
                    const loop = (timestamp) => {
                        this.animationFrameId = requestAnimationFrame(loop);
                        const dt = (timestamp - this.lastFrameTime) / 1000;
                        this.lastFrameTime = timestamp;

                        this.foodPulsePhase += dt * 3;
                        this.particleSystem.update(dt);

                        if (this.isGameRunning && !this.isPaused && !this.gameOverTriggered) {
                            this.logicAccumulator += dt * 1000;
                            while (this.logicAccumulator >= this.gameSpeed) {
                                this.logicAccumulator -= this.gameSpeed;
                                this.directionChangedThisFrame = false;
                                this.gameStep();
                                if (this.gameOverTriggered) break;
                            }
                            if (this.logicAccumulator > this.gameSpeed * 3) {
                                this.logicAccumulator = 0;
                            }
                        }

                        this.draw();
                    };
                    this.animationFrameId = requestAnimationFrame(loop);
                }

                stopRenderLoop() {
                    if (this.animationFrameId) {
                        cancelAnimationFrame(this.animationFrameId);
                        this.animationFrameId = null;
                    }
                }

                gameStep() {
                    this.dx = this.nextDx;
                    this.dy = this.nextDy;
                    this.moveSnake();
                    if (this.checkCollision()) {
                        this.triggerGameOver();
                    }
                }

                start() {
                    this.gameOverTriggered = false;
                    this.isGameRunning = true;
                    this.isPaused = false;
                    this.logicAccumulator = 0;
                    this.lastFrameTime = performance.now();
                    this.directionChangedThisFrame = false;

                    document.getElementById('gameOver').style.display = 'none';
                    document.getElementById('pauseMenu').style.display = 'none';
                    document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-pause"></i> 暂停游戏';
                    this.updateUI();
                }

                moveSnake() {
                    const head = { x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy };
                    this.snake.unshift(head);
                    if (head.x === this.food.x && head.y === this.food.y) {
                        this.eatFood();
                    } else {
                        this.snake.pop();
                    }
                }

                eatFood() {
                    this.score += 10;
                    this.foodCount++;
                    const fx = this.food.x + this.gridSize / 2;
                    const fy = this.food.y + this.gridSize / 2;
                    this.particleSystem.emit(fx, fy, 14, 'rgb(255,82,82)', 100, 0.55);
                    this.particleSystem.emit(fx, fy, 8, 'rgb(255,200,50)', 70, 0.4);

                    if (this.foodCount % 5 === 0) {
                        this.level++;
                        this.gameSpeed = Math.max(40, 150 - (this.level - 1) * 10);
                        this.particleSystem.emit(fx, fy, 20, 'rgb(46,204,113)', 140, 0.7);
                    }
                    this.generateFood();
                    this.updateUI();
                    this.flashFoodCount();
                }

                generateFood() {
                    const maxAttempts = this.gridCount * this.gridCount;
                    let attempts = 0;
                    let validPosition = false;
                    while (!validPosition && attempts < maxAttempts) {
                        const fx = Math.floor(Math.random() * this.gridCount) * this.gridSize;
                        const fy = Math.floor(Math.random() * this.gridCount) * this.gridSize;
                        validPosition = true;
                        for (const segment of this.snake) {
                            if (segment.x === fx && segment.y === fy) {
                                validPosition = false;
                                break;
                            }
                        }
                        if (validPosition) this.food = { x: fx, y: fy };
                        attempts++;
                    }
                    if (!validPosition) {
                        for (let gx = 0; gx < this.gridCount; gx++) {
                            for (let gy = 0; gy < this.gridCount; gy++) {
                                const fx = gx * this.gridSize;
                                const fy = gy * this.gridSize;
                                let occupied = false;
                                for (const segment of this.snake) {
                                    if (segment.x === fx && segment.y === fy) {
                                        occupied = true;
                                        break;
                                    }
                                }
                                if (!occupied) {
                                    this.food = { x: fx, y: fy };
                                    return;
                                }
                            }
                        }
                        this.food = { x: 0, y: 0 };
                    }
                }

                checkCollision() {
                    const head = this.snake[0];
                    if (head.x < 0 || head.y < 0 || head.x >= this.canvas.width || head.y >= this.canvas.height) return true;
                    for (let i = 1; i < this.snake.length; i++) {
                        if (head.x === this.snake[i].x && head.y === this.snake[i].y) return true;
                    }
                    return false;
                }

                triggerGameOver() {
                    this.gameOverTriggered = true;
                    this.isGameRunning = false;
                    const head = this.snake[0];
                    const hx = head.x + this.gridSize / 2;
                    const hy = head.y + this.gridSize / 2;
                    this.particleSystem.emit(hx, hy, 25, 'rgb(231,76,60)', 160, 0.8);
                    this.particleSystem.emit(hx, hy, 15, 'rgb(255,150,50)', 120, 0.6);
                    document.getElementById('finalScore').textContent = this.score;
                    document.getElementById('gameOver').style.display = 'block';
                    clearTimeout(this._gameOverTimeout);
                    this._gameOverTimeout = setTimeout(() => {
                        const input = document.getElementById('playerName');
                        if (input && document.getElementById('gameOver').style.display !== 'none') input.focus();
                    }, 350);
                }

                draw() {
                    const ctx = this.ctx;
                    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    this.drawGrid(ctx);
                    this.drawFood(ctx);
                    this.drawSnake(ctx);
                    this.particleSystem.draw(ctx);
                    if (this.gameOverTriggered) this.drawGameOverOverlay(ctx);
                    else if (this.isPaused) this.drawPausedOverlay(ctx);
                }

                drawGrid(ctx) {
                    const gs = this.gridSize;
                    for (let i = 0; i < this.gridCount; i++) {
                        for (let j = 0; j < this.gridCount; j++) {
                            ctx.fillStyle = (i + j) % 2 === 0 ? '#1e3a5f' : '#1a3150';
                            ctx.fillRect(i * gs, j * gs, gs, gs);
                        }
                    }
                }

                drawSnake(ctx) {
                    const gs = this.gridSize;
                    this.snake.forEach((seg, idx) => {
                        if (idx === 0) {
                            const grad = ctx.createLinearGradient(seg.x, seg.y, seg.x + gs, seg.y + gs);
                            grad.addColorStop(0, '#3dfc7c');
                            grad.addColorStop(0.5, '#2ecc71');
                            grad.addColorStop(1, '#1fa852');
                            ctx.fillStyle = grad;
                            ctx.fillRect(seg.x + 0.5, seg.y + 0.5, gs - 1, gs - 1);
                            ctx.strokeStyle = '#1dff6b';
                            ctx.lineWidth = 1.5;
                            ctx.strokeRect(seg.x + 1, seg.y + 1, gs - 2, gs - 2);
                            this.drawSnakeEyes(ctx, seg);
                        } else {
                            const p = idx / Math.max(1, this.snake.length - 1);
                            ctx.fillStyle = `rgb(${30+p*10},${160-p*40},${80+p*30})`;
                            ctx.fillRect(seg.x + 1, seg.y + 1, gs - 2, gs - 2);
                            ctx.fillStyle = `rgba(255,255,255,${0.06+p*0.04})`;
                            ctx.fillRect(seg.x + 3, seg.y + 3, gs - 6, gs - 6);
                            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                            ctx.lineWidth = 0.5;
                            ctx.strokeRect(seg.x + 1, seg.y + 1, gs - 2, gs - 2);
                        }
                    });
                }

                drawSnakeEyes(ctx, head) {
                    const gs = this.gridSize;
                    const eyeSize = gs / 5;
                    const off = gs / 3.5;
                    ctx.fillStyle = '#000';
                    if (this.dx > 0) {
                        ctx.fillRect(head.x+gs-off-eyeSize, head.y+off-eyeSize/2, eyeSize, eyeSize);
                        ctx.fillRect(head.x+gs-off-eyeSize, head.y+gs-off, eyeSize, eyeSize);
                    } else if (this.dx < 0) {
                        ctx.fillRect(head.x+off-eyeSize/2, head.y+off-eyeSize/2, eyeSize, eyeSize);
                        ctx.fillRect(head.x+off-eyeSize/2, head.y+gs-off, eyeSize, eyeSize);
                    } else if (this.dy > 0) {
                        ctx.fillRect(head.x+off-eyeSize/2, head.y+gs-off-eyeSize/2, eyeSize, eyeSize);
                        ctx.fillRect(head.x+gs-off, head.y+gs-off-eyeSize/2, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(head.x+off-eyeSize/2, head.y+off, eyeSize, eyeSize);
                        ctx.fillRect(head.x+gs-off, head.y+off, eyeSize, eyeSize);
                    }
                    ctx.fillStyle = '#fff';
                    const hs = eyeSize/2.5;
                    if (this.dx > 0) ctx.fillRect(head.x+gs-off-eyeSize+1, head.y+off-eyeSize/2+1, hs, hs);
                    else if (this.dx < 0) ctx.fillRect(head.x+off-eyeSize/2+1, head.y+off-eyeSize/2+1, hs, hs);
                    else if (this.dy > 0) ctx.fillRect(head.x+off-eyeSize/2+1, head.y+gs-off-eyeSize/2+1, hs, hs);
                    else ctx.fillRect(head.x+off-eyeSize/2+1, head.y+off+1, hs, hs);
                }

                drawFood(ctx) {
                    const gs = this.gridSize;
                    const cx = this.food.x + gs/2;
                    const cy = this.food.y + gs/2;
                    const baseR = gs/2 - 1.5;
                    const glowIntensity = 0.5 + Math.sin(this.foodPulsePhase) * 0.5;
                    const glowR = baseR + 3 + glowIntensity * 5;
                    const glowGrad = ctx.createRadialGradient(cx, cy, baseR*0.6, cx, cy, glowR);
                    glowGrad.addColorStop(0, 'rgba(255,82,82,0.5)');
                    glowGrad.addColorStop(0.7, 'rgba(255,82,82,0.15)');
                    glowGrad.addColorStop(1, 'rgba(255,82,82,0)');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath(); ctx.arc(cx, cy, glowR, 0, Math.PI*2); ctx.fill();
                    const bodyGrad = ctx.createRadialGradient(cx-gs/6, cy-gs/5, gs/10, cx, cy, baseR);
                    bodyGrad.addColorStop(0, '#FF8A80');
                    bodyGrad.addColorStop(0.4, '#FF5252');
                    bodyGrad.addColorStop(1, '#c0392b');
                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath(); ctx.arc(cx, cy, baseR, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.55)';
                    ctx.beginPath(); ctx.arc(cx-gs/5, cy-gs/4, gs/7, 0, Math.PI*2); ctx.fill();
                }

                drawGameOverOverlay(ctx) {
                    ctx.fillStyle = 'rgba(0,0,0,0.82)';
                    ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = 'bold 34px "Segoe UI", Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('游戏结束!', this.canvas.width/2, this.canvas.height/2-35);
                    ctx.fillStyle = '#fff';
                    ctx.font = '22px "Segoe UI", Arial';
                    ctx.fillText(`得分: ${this.score}`, this.canvas.width/2, this.canvas.height/2+8);
                    ctx.fillStyle = '#aaa';
                    ctx.font = '15px "Segoe UI", Arial';
                    ctx.fillText('按 Enter 键重新开始', this.canvas.width/2, this.canvas.height/2+48);
                }

                drawPausedOverlay(ctx) {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 28px "Segoe UI", Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('游戏暂停', this.canvas.width/2, this.canvas.height/2-16);
                    ctx.fillStyle = '#ccc';
                    ctx.font = '16px "Segoe UI", Arial';
                    ctx.fillText('按 P 键继续', this.canvas.width/2, this.canvas.height/2+22);
                }

                updateUI() {
                    document.getElementById('score').textContent = `得分: ${this.score}`;
                    document.getElementById('food-count').textContent = this.foodCount;
                    document.getElementById('snake-length').textContent = this.snake.length;
                    document.getElementById('level').textContent = this.level;
                    document.getElementById('levelProgress').style.width = `${(this.foodCount%5)*20}%`;
                    document.getElementById('pauseScore').textContent = this.score;
                }

                flashFoodCount() {
                    const el = document.getElementById('food-count');
                    el.classList.remove('pop');
                    void el.offsetWidth;
                    el.classList.add('pop');
                }

                changeDirection(dx, dy, dirName) {
                    if (this.isPaused || !this.isGameRunning || this.gameOverTriggered) return;
                    if (this.directionChangedThisFrame) return;
                    if (dx !== 0 && this.dx === -dx && this.dy === 0) return;
                    if (dy !== 0 && this.dy === -dy && this.dx === 0) return;
                    if (dx === this.dx && dy === this.dy) return;
                    this.nextDx = dx;
                    this.nextDy = dy;
                    this.lastDirection = dirName;
                    this.directionChangedThisFrame = true;
                }

                togglePause() {
                    if (!this.isGameRunning || this.gameOverTriggered) return;
                    this.isPaused = !this.isPaused;
                    document.getElementById('pauseBtn').innerHTML = this.isPaused ?
                        '<i class="fas fa-play"></i> 继续游戏' :
                        '<i class="fas fa-pause"></i> 暂停游戏';
                    if (this.isPaused) {
                        document.getElementById('pauseMenu').style.display = 'block';
                        document.getElementById('pauseScore').textContent = this.score;
                    } else {
                        document.getElementById('pauseMenu').style.display = 'none';
                        this.logicAccumulator = 0;
                        this.directionChangedThisFrame = false;
                    }
                }

                restart() {
                    clearTimeout(this._gameOverTimeout);
                    this.reset();
                    this.start();
                }

                setupControls() {
                    const bind = (id, dx, dy, dir) => {
                        const btn = document.getElementById(id);
                        const handler = (e) => { e.preventDefault(); this.changeDirection(dx, dy, dir); };
                        btn.addEventListener('pointerdown', handler, { passive: false });
                        btn.addEventListener('click', (e) => { e.preventDefault(); this.changeDirection(dx, dy, dir); });
                    };
                    bind('up', 0, -this.gridSize, 'up');
                    bind('down', 0, this.gridSize, 'down');
                    bind('left', -this.gridSize, 0, 'left');
                    bind('right', this.gridSize, 0, 'right');

                    document.addEventListener('keydown', (e) => {
                        const activeEl = document.activeElement;
                        const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable);
                        if (isInput && e.key !== 'Escape') {
                            if (e.key === 'Enter' && document.getElementById('gameOver').style.display !== 'none') {
                                e.preventDefault();
                                window.saveScore();
                            }
                            return;
                        }
                        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
                        if (e.key === 'Enter' && (this.gameOverTriggered || !this.isGameRunning)) {
                            e.preventDefault();
                            this.restart();
                            return;
                        }
                        if (!this.isGameRunning && !this.gameOverTriggered) return;
                        if (this.gameOverTriggered) {
                            if (e.key === 'r' || e.key === 'R') this.restart();
                            return;
                        }
                        const key = e.key.toLowerCase();
                        if (key === 'arrowup' || key === 'w') this.changeDirection(0, -this.gridSize, 'up');
                        else if (key === 'arrowdown' || key === 's') this.changeDirection(0, this.gridSize, 'down');
                        else if (key === 'arrowleft' || key === 'a') this.changeDirection(-this.gridSize, 0, 'left');
                        else if (key === 'arrowright' || key === 'd') this.changeDirection(this.gridSize, 0, 'right');
                        else if (key === ' ' || key === 'p') this.togglePause();
                        else if (key === 'escape' && this.isPaused) this.togglePause();
                        else if (key === 'r') this.restart();
                    });

                    document.querySelectorAll('.control-btn').forEach(btn => {
                        btn.addEventListener('touchstart', (e) => { e.preventDefault(); btn.click(); }, { passive: false });
                    });
                }

                loadRanking() {}
            }

            class RankingManager {
                constructor() {
                    this.storageKey = 'snakeRanking_v2';
                    this.ranking = this.load();
                    this.maxEntries = 10;
                    this.updateDisplay();
                }
                load() {
                    try { return JSON.parse(localStorage.getItem(this.storageKey)) || []; } catch(e) { return []; }
                }

                save() {
                    try { localStorage.setItem(this.storageKey, JSON.stringify(this.ranking)); } catch(e) {}
                }

                addEntry(name, score) {
                    this.ranking.push({ name, score, timestamp: Date.now() });
                    this.ranking.sort((a, b) => b.score - a.score || a.timestamp - b.timestamp);
                    this.ranking = this.ranking.slice(0, this.maxEntries);
                    this.save();
                    this.updateDisplay();
                }

                clear() {
                    this.ranking = [];
                    this.save();
                    this.updateDisplay();
                }

                updateDisplay() {
                    const list = document.getElementById('rankingList');
                    list.innerHTML = '';
                    if (!this.ranking.length) {
                        const li = document.createElement('li');
                        li.classList.add('ranking-empty');
                        li.textContent = '暂无记录';
                        list.appendChild(li);
                        return;
                    }
                    this.ranking.forEach((entry, i) => {
                        const li = document.createElement('li');
                        li.innerHTML = `<span>${i + 1}. ${this.escapeHtml(entry.name)}</span><span>${entry.score}</span>`;
                        if (i === 0) li.classList.add('rank-1');
                        else if (i === 1) li.classList.add('rank-2');
                        else if (i === 2) li.classList.add('rank-3');
                        list.appendChild(li);
                    });
                }

                escapeHtml(str) {
                    const d = document.createElement('div');
                    d.textContent = str;
                    return d.innerHTML;
                }
            }

            let game, rankingManager;

            function initGame() {
                rankingManager = new RankingManager();
                game = new SnakeGame();
                game.rankingManager = rankingManager;
                game.start();
            }

            window.togglePause = () => game?.togglePause();
            window.restartGame = () => game?.restart();

            window.saveScore = () => {
                if (!game || !rankingManager) return;
                const nameInput = document.getElementById('playerName');
                const name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : '匿名玩家';
                rankingManager.addEntry(name, game.score);
                if (nameInput) nameInput.value = '';
                document.getElementById('gameOver').style.display = 'none';
                game.restart();
            };

            window.clearRanking = () => {
                if (confirm('确定要清空排行榜吗？')) rankingManager.clear();
            };

            window.addEventListener('DOMContentLoaded', initGame);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && game && game.isGameRunning && !game.isPaused && !game.gameOverTriggered) game.togglePause();
            });
        })();
    </script>
